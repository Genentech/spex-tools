site_name: spex-tools
site_url: https://genentech.github.io/spex-tools/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_source: false
  - mkdocs-jupyter:
      execute: false

nav:
  - Home: index.md
  - API Reference: api.md